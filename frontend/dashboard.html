<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UYIRVA — Farmer Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .dashboard-app{display:block;margin:40px auto}.dashboard-hero{min-height:210px;margin-bottom:16px;padding:28px;border-radius:16px;display:flex;align-items:end;background:linear-gradient(90deg,rgba(9,36,20,.9),rgba(9,36,20,.35)),url('/farmer-dashboard.jpg') center/cover}.dashboard-hero h2{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 6px}.dashboard-hero p{max-width:52ch;margin:0;color:var(--cream)}.feature-card{background:rgba(9,36,20,.58);padding:18px;border-radius:12px;margin-bottom:16px;border:1px solid var(--line);backdrop-filter:blur(10px)}.feature-card h3{margin-bottom:8px;font-size:1.1rem;color:var(--wheat)}.feature-grid{display:grid;grid-template-columns:1fr;gap:16px}.listing-list,.buyer-requirements,.order-list{display:grid;gap:12px}.listing-item,.buyer-requirement,.order-item{padding:13px;border-radius:10px;background:rgba(255,255,255,.08)}.listing-item{display:flex;gap:14px;align-items:flex-start}.listing-item img{width:78px;height:78px;object-fit:cover;border-radius:9px}.buyer-requirement{border-left:3px solid var(--wheat)}.buyer-requirement span{float:right}.buyer-requirement small,.order-item small,.buyer-note{color:var(--muted);font-size:.82rem}.driver-details{margin-top:10px;padding:10px;border-radius:9px;background:rgba(90,143,94,.2);border:1px solid rgba(233,185,73,.35)}.driver-details p{margin:6px 0 0}.listing-success{padding:11px 14px;border-radius:10px;background:rgba(90,143,94,.3);border:1px solid var(--line);color:#e0f3d9;font-weight:700}.listing-form{gap:18px}.form-section{display:grid;gap:12px;padding:14px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(8,31,18,.26)}.form-section h3{margin:0;color:var(--wheat);font-size:1.03rem}.form-section>p{margin:-5px 0 1px;color:var(--muted);font-size:.8rem}.field-grid{display:grid;gap:12px}.listing-form label{font-size:.86rem}.listing-form label small{font-weight:400;color:var(--muted)}.listing-form input,.listing-form select{background:rgba(7,29,16,.6)}.listing-form .button{width:100%;margin-top:2px}@media(min-width:700px){.feature-grid,.field-grid{grid-template-columns:repeat(2,1fr)}.form-section .full-width{grid-column:1/-1}}
  </style>
</head>
<body class="farmer-dashboard">
  <section class="dashboard-app" id="dashboard-app"></section>
  <div class="auth-modal" id="listing-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="auth-card glass">
      <button class="auth-close" type="button" aria-label="Close">×</button>
      <h2>List your vegetables</h2>
      <p class="auth-copy">All fields are required. Quantity is always in kilograms.</p>
      <form class="auth-form listing-form" id="listing-form" novalidate>
        <section class="form-section"><h3>1. Vegetable &amp; quantity</h3><p>Tell buyers what you have available.</p><div class="field-grid"><label>Vegetable name<select name="crop" required><option value="">Select a vegetable</option><option>Tomato</option><option>Onion</option><option>Potato</option><option>Brinjal</option><option>Carrot</option><option>Beans</option><option>Cabbage</option><option>Cauliflower</option><option>Okra</option><option>Chilli</option><option>Cucumber</option><option>Drumstick</option></select></label><label>Quantity available <small>(kilograms)</small><input name="quantity" type="number" inputmode="numeric" min="1" step="1" placeholder="Example: 500" required></label><label class="full-width">Expected price <small>(₹ per kilogram)</small><input name="price" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="Example: 25" required></label></div></section>
        <section class="form-section"><h3>2. Harvest &amp; pickup schedule</h3><p>Pick dates using the calendar and choose a pickup time.</p><div class="field-grid"><label>Harvest date<input name="harvest_date" type="date" required></label><label>Pickup-ready date<input name="pickup_date" type="date" required></label><label class="full-width">Pickup-ready time<input name="pickup_time" type="time" required></label></div></section>
        <section class="form-section"><h3>3. Quality &amp; location</h3><p>These fields help buyers decide quickly.</p><div class="field-grid"><label>Pickup location<select name="location" required><option value="">Choose serviced area</option><option>Coimbatore</option><option>Pollachi</option><option>Mettupalayam</option><option>Tiruppur</option><option>Erode</option></select></label><label>Freshness<select name="freshness" required><option value="">Choose freshness</option><option>Fresh today</option><option>Harvested within 24 hours</option><option>Harvested within 2 days</option></select></label><label>AGMARK status<select name="agmark" required><option value="">Choose status</option><option>AGMARK certified</option><option>Applied for AGMARK</option><option>Not certified</option></select></label><label>Quality grade<select name="quality_grade" required><option value="">Choose quality</option><option>Premium / Grade A</option><option>Grade A</option><option>Grade B</option><option>Standard</option></select></label><label class="full-width">Vegetable image <small>(JPG or PNG)</small><input name="photo" type="file" accept="image/jpeg,image/png" required></label></div>
        <img id="listing-image-preview" alt="Vegetable preview" hidden style="width:100%;max-height:160px;object-fit:cover;border-radius:10px"></section>
        <p class="auth-error" id="listing-error" role="alert"></p>
        <button class="button primary" type="submit">Publish vegetable listing</button>
      </form>
    </div>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
