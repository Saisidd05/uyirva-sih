<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UYIRVA — Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Additional styles for dashboard features */
    .dashboard-app { display: block; margin: 40px auto; }
    .action-row { margin-bottom: 24px; display: flex; gap: 12px; }
    .feature-card { background: rgba(9, 36, 20, 0.42); padding: 18px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--line); }
    .feature-card h3 { margin-bottom: 8px; font-size: 1.1rem; color: var(--wheat); }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
    .status-escrow { background: rgba(90, 143, 94, 0.3); color: #e0f3d9; }
    .feature-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .listing-list, .buyer-requirements { display: grid; gap: 12px; }
    .listing-item, .buyer-requirement { display: flex; gap: 14px; align-items: flex-start; padding: 13px; border-radius: 10px; background: rgba(255,255,255,.08); }
    .listing-item img { width: 78px; height: 78px; object-fit: cover; border-radius: 9px; }
    .delete-listing { margin-top: 8px; padding: 5px 10px; border: 1px solid #d98275; border-radius: 7px; background: transparent; color: #ffd0ca; cursor: pointer; font-size: .78rem; font-weight: 700; }
    .listing-item p, .buyer-requirement p { margin: 4px 0; }
    .listing-item small, .buyer-requirement small, .buyer-requirement span, .buyer-note { color: var(--muted); font-size: .82rem; }
    .buyer-requirement { display: block; border-left: 3px solid var(--wheat); }
    .buyer-requirement span { float: right; }
    .listing-success { padding: 11px 14px; border-radius: 10px; background: rgba(90,143,94,.3); border: 1px solid var(--line); color: #e0f3d9; font-weight: 700; }
    @media(min-width: 700px) { .feature-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  
  <section class="dashboard-app" id="dashboard-app">
    <!-- Populated by JS -->
  </section>

  <!-- Create Listing Modal for Farmer -->
  <div class="auth-modal" id="listing-modal" role="dialog" aria-hidden="true">
    <div class="auth-card glass">
      <button class="auth-close" type="button" aria-label="Close">×</button>
      <h2>List your vegetables</h2>
      <p class="auth-copy">Add the vegetable details buyers need to see.</p>
      <form class="auth-form" id="listing-form">
        <label>Vegetable name<select name="crop" required><option value="">Select a vegetable</option><option>Tomato</option><option>Onion</option><option>Potato</option><option>Brinjal</option><option>Carrot</option><option>Beans</option><option>Cabbage</option><option>Cauliflower</option><option>Okra</option><option>Chilli</option><option>Cucumber</option><option>Drumstick</option><option>Other vegetables</option></select></label>
        <label>Quantity (kg)<input name="quantity" type="number" min="1" placeholder="e.g. 500" required></label>
        <label>Your rate (₹ per kg)<input name="price" type="number" min="1" placeholder="e.g. 25" required></label>
        <label>Freshness<select name="freshness"><option>Fresh today</option><option>Harvested within 24 hours</option><option>Harvested within 2 days</option></select></label>
        <label>AGMARK status<select name="agmark"><option>AGMARK certified</option><option>Applied for AGMARK</option><option>Not certified</option></select></label>
        <label>Quality<select name="quality_grade"><option>Premium / Grade A</option><option>Grade A</option><option>Grade B</option><option>Standard</option></select></label>
        <label>Vegetable image<input name="photo" type="file" accept="image/*"></label>
        <img id="listing-image-preview" alt="Vegetable preview" hidden style="width:100%;max-height:160px;object-fit:cover;border-radius:10px">
        <p class="auth-error" id="listing-error"></p>
        <button class="button primary" type="submit">Publish vegetable listing</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
